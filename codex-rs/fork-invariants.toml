# Behavioral invariants that must remain true in this fork.
#
# This file is intentionally descriptive. The `fork-invariants` recipe executes
# the named Rust tests directly; it does not parse this manifest or use source
# marker searches as a gate.
version = 1
scope = "codex-rs"

[[invariant]]
id = "providers.local"
owner = "codex-core"
tests = [
    "fork_invariant_claude_code_provider_can_be_selected_by_role",
    "fork_invariant_chatgpt_web_provider_can_be_selected_by_role",
    "fork_invariant_claude_model_routes_to_claude_provider",
    "fork_invariant_chatgpt_web_model_routes_to_chatgpt_web_provider",
    "fork_invariant_local_provider_message_forms_require_plaintext",
    "fork_invariant_local_claude_drops_encrypted_agent_messages",
]

